name: Hourly Submodule Sync

on:
  schedule:
    # 每小时整点（UTC）运行一次 → 对应本地时间（UTC+8）的 08:00/09:00/... 整点
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      submodules:
        description: '子模块列表（路径，逗号分隔），留空=更新全部。例如：opendbc_repo,panda,msgq_repo'
        required: false
        default: ''
      branch:
        description: '基准分支，留空=当前工作流默认分支（RK3588）'
        required: false
        default: ''
      only_check:
        description: '仅检查不提交（dry-run：检测是否有更新，写 summary，但不 commit/PR）'
        required: false
        type: choice
        options: ['no', 'yes']
        default: 'no'

# 同一分支同一时间只允许一个同步实例跑，避免多个 cron 并发 commit/PR
concurrency:
  group: submodule-sync-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # 强制 GitHub Hosted JS actions 走 Node 24（针对 actions/checkout@v5 的未来兼容与告警消除）
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write
  pull-requests: write

# 统一 shell 行为：显式声明 bash，且在所有 step.run 第一行自行 set -eu（避免 runner 默认带的
# -o pipefail 让 "git … 2>&1 | tail" 这种合法管道的 SIGPIPE 被当成失败传播）。
defaults:
  run:
    shell: bash

jobs:
  sync:
    name: Sync & commit submodule updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve target branch
        id: target
        shell: bash
        run: |
          set -eu
          INPUT_BRANCH="${{ github.event.inputs.branch }}"
          if [[ -n "$INPUT_BRANCH" ]]; then
            TARGET="$INPUT_BRANCH"
          else
            TARGET="${GITHUB_REF_NAME}"
            if [[ -z "$TARGET" || "$TARGET" == "refs/heads/"* ]]; then
              TARGET="${GITHUB_REF_NAME#refs/heads/}"
            fi
            # GitHub scheduled event runs against default branch; GITHUB_REF_NAME is already short
          fi
          # Sanity: ensure origin/$TARGET exists
          git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${TARGET}" >/dev/null || {
            echo "::error::基准分支 origin/${TARGET} 不存在，请在 workflow_dispatch 里手动指定正确分支"
            exit 2
          }
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Checkout base repo (no submodules)
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.target }}
          submodules: false
          fetch-depth: 1
          # 注意：这里不使用 token 注入到全局 HTTP 头，避免第三方子模块 (commaai/*, sunnypilot/*)
          # 被错误地带上 GITHUB_TOKEN，从而返回 403。
          persist-credentials: false

      - name: Tune git HTTP (avoid flaky 128 on GitHub large fetches)
        shell: bash
        run: |
          set -eu
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global protocol.version 2
          # 子模块用匿名 HTTPS 访问（不要透传 GITHUB_TOKEN 给第三方仓库）
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --global credential.helper '' || true

      - name: Init + shallow fetch submodules
        shell: bash
        run: |
          set -eu
          # shallow 初始化；后面按每个子模块再 fetch 指定分支
          git submodule sync --recursive
          git submodule update --init --depth 50 --jobs 4

      - name: List allowed submodules (from .gitmodules)
        id: list
        shell: bash
        run: |
          set -eu
          ALLOWED=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
                    | awk '{print $NF}' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "allowed=${ALLOWED}" >> "$GITHUB_OUTPUT"

          INPUT="${{ github.event.inputs.submodules }}"
          if [[ -z "$INPUT" ]]; then
            SELECTED="$ALLOWED"
          else
            # Trim spaces; filter to allowed paths
            SELECTED=""
            IFS=',' read -ra ARR <<< "$INPUT"
            for i in "${ARR[@]}"; do
              i="${i// /}"
              [[ -z "$i" ]] && continue
              if [[ ",${ALLOWED}," == *",${i},"* ]]; then
                SELECTED="${SELECTED},${i}"
              else
                echo "::warning::忽略不在 .gitmodules 中的子模块名: ${i}"
              done
            done
            SELECTED="${SELECTED#,}"
          fi
          if [[ -z "$SELECTED" ]]; then
            echo "::error::没有可处理的有效子模块"
            exit 3
          fi
          echo "selected=${SELECTED}" >> "$GITHUB_OUTPUT"

      - name: Update submodules and collect changes
        id: changes
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.target }}
          SELECTED_SM: ${{ steps.list.outputs.selected }}
        run: |
          # 注意：不要启用 pipefail；我们会通过 PIPESTATUS/变量捕获/临时文件来判定关键命令真实退出码。
          set -eu
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          echo "stamp=${STAMP}" >> "$GITHUB_OUTPUT"
          LOG_DIR="${RUNNER_TEMP}/submodule-sync-logs"
          DEBUG_DIR="${RUNNER_TEMP}/submodule-sync-debug"
          mkdir -p "$LOG_DIR" "$DEBUG_DIR"
          echo "logdir=${LOG_DIR}" >> "$GITHUB_OUTPUT"

          UPDATED_NAMES=""
          UPDATED_PATHS=""
          UPDATED_ANY=0
          FAILED_NAMES=""
          FAILED_ANY=0

          # 安全地将子模块 url 中任何潜在的 GITHUB_TOKEN 式授权信息全部剔除，保证匿名 HTTPS。
          sm_git() {
            local dir="$1"; shift
            git -C "$dir" \
              -c http.https://github.com/.extraheader= \
              -c http.extraheader= \
              -c credential.helper= \
              -c gc.auto=0 \
              "$@"
          }

          # 返回值：0 成功，非 0 失败；同时会把结果写到 /tmp 共享文件。
          run_fetch_with_retry() {
            local dir="$1" url="$2" refspec="$3"
            local max=3 i=0 rc=1
            local err_file="${DEBUG_DIR}/$(echo "$dir" | tr '/' '_').err"
            : > "$err_file"
            for ((i=1; i<=max; i++)); do
              echo "  [fetch $i/$max] dir=$dir refspec=${refspec:-<default>}"
              local tmp_out
              tmp_out="$(mktemp)"
              if [[ -n "$refspec" ]]; then
                # 精确分支 fetch
                sm_git "$dir" fetch --depth 50 origin "$refspec" >"$tmp_out" 2>>"$err_file"
                rc=$?
              else
                # 默认分支 fetch
                sm_git "$dir" fetch --depth 50 origin >"$tmp_out" 2>>"$err_file"
                rc=$?
              fi
              rm -f "$tmp_out"
              if [[ $rc -eq 0 ]]; then
                # 保留最后一次成功的简短 tail 作为调试（5 行以内）
                tail -n 5 "$err_file" 2>/dev/null || true
                return 0
              fi
              # Backoff: 3s / 6s
              sleep $(( i * 3 ))
            done
            echo "  [fetch FAILED after ${max} retries]. stderr tail:"
            tail -n 30 "$err_file" 2>/dev/null || true
            return $rc
          }

          resolve_default_branch() {
            local dir="$1" url="$2" out=""
            # 最快、最不依赖网络：本地子模块是否已经注册了 refs/remotes/origin/HEAD
            if out="$(sm_git "$dir" symbolic-ref refs/remotes/origin/HEAD 2>/dev/null)"; then
              printf '%s' "${out#refs/remotes/origin/}"
              return 0
            fi
            # 否则通过匿名 HTTPS ls-remote --symref 取服务端的 HEAD 映射（不 fetch 内容，更轻）
            out="$(git ls-remote --symref "$url" HEAD 2>/dev/null \
                  | awk '$2=="HEAD" && $1 ~ /^ref:/ { sub(/^ref: refs\/heads\//,"",$1); print $1; exit }')"
            if [[ -n "$out" ]]; then
              printf '%s' "$out"
              return 0
            fi
            # 最后兜底：常见候选（master/main），若远程确实有其一则返回
            for cand in master main; do
              if git ls-remote --exit-code --heads "$url" "refs/heads/${cand}" >/dev/null 2>&1; then
                printf '%s' "$cand"
                return 0
              fi
            done
            return 1
          }

          IFS=',' read -ra SM_ARR <<< "$SELECTED_SM"
          for SM in "${SM_ARR[@]}"; do
            [[ -z "$SM" ]] && continue
            echo "=== Processing ${SM} ==="

            # 1) 主仓库 index 上登记的 gitlink 指针（最稳定来源）
            BEFORE=""
            STAGE_LINE="$(git ls-files --stage -- "$SM" 2>/dev/null || true)"
            if [[ -n "$STAGE_LINE" ]]; then
              # 用 awk 取 <mode> <sha> <stage>\t<path> 中的 <sha>
              BEFORE="$(awk '{print $2}' <<< "$STAGE_LINE")"
            fi
            if [[ -z "$BEFORE" ]]; then
              BEFORE="$(git submodule status -- "$SM" 2>/dev/null | awk '{gsub(/^[-+U]/,"",$1); print $1; exit}')" || true
            fi
            if [[ -z "$BEFORE" ]]; then
              echo "::warning::无法读取 ${SM} 的 before 指针，跳过"
              FAILED_ANY=1
              if [[ -z "$FAILED_NAMES" ]]; then
                FAILED_NAMES="${SM}(before-unknown)"
              else
                FAILED_NAMES="${FAILED_NAMES}, ${SM}(before-unknown)"
              fi
              continue
            fi
            SHORT_BEFORE="${BEFORE:0:9}"
            echo "  @ before=${BEFORE}"

            # 2) 子模块声明的 url / branch
            SM_CFG_KEY=""
            while IFS= read -r line; do
              cfg_path="${line#* }"
              if [[ "$cfg_path" == "$SM" ]]; then
                SM_CFG_KEY="${line#submodule.}"
                SM_CFG_KEY="${SM_CFG_KEY%.path*}"
                break
              fi
            done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$')
            SM_URL="$(git config -f .gitmodules --get "submodule.${SM_CFG_KEY}.url" || true)"
            SM_BRANCH="$(git config -f .gitmodules --get "submodule.${SM_CFG_KEY}.branch" || true)"

            # 3) Fetch 子模块（匿名 HTTPS，3 次重试）
            TARGET_SHA=""
            FETCH_OK=0
            SM_BRANCH_EFFECTIVE="$SM_BRANCH"
            if [[ -n "$SM_BRANCH_EFFECTIVE" ]]; then
              if run_fetch_with_retry "$SM" "$SM_URL" "refs/heads/${SM_BRANCH_EFFECTIVE}:refs/remotes/origin/${SM_BRANCH_EFFECTIVE}"; then
                TARGET_SHA="$(sm_git "$SM" rev-parse --verify "refs/remotes/origin/${SM_BRANCH_EFFECTIVE}" 2>/dev/null || true)"
                [[ -n "$TARGET_SHA" ]] && FETCH_OK=1
              fi
            fi
            if [[ $FETCH_OK -eq 0 ]]; then
              # 未声明 branch 或声明失败：拿远程默认分支名做精确 fetch（比裸 `fetch origin` 更稳定）
              SM_BRANCH_EFFECTIVE="$(resolve_default_branch "$SM" "$SM_URL")" || SM_BRANCH_EFFECTIVE=""
              if [[ -n "$SM_BRANCH_EFFECTIVE" ]]; then
                echo "  -> resolved default branch '${SM_BRANCH_EFFECTIVE}' for ${SM}"
                if run_fetch_with_retry "$SM" "$SM_URL" "refs/heads/${SM_BRANCH_EFFECTIVE}:refs/remotes/origin/${SM_BRANCH_EFFECTIVE}"; then
                  TARGET_SHA="$(sm_git "$SM" rev-parse --verify "refs/remotes/origin/${SM_BRANCH_EFFECTIVE}" 2>/dev/null || true)"
                  [[ -n "$TARGET_SHA" ]] && FETCH_OK=1
                fi
              fi
            fi
            if [[ $FETCH_OK -eq 0 ]]; then
              # 最后兜底：裸 fetch origin 并从 FETCH_HEAD 第一行解析（有些 repo/镜像不暴露 symref HEAD）
              echo "  -> fallback: plain 'fetch origin' + FETCH_HEAD parse"
              if run_fetch_with_retry "$SM" "$SM_URL" ""; then
                FH="$(sm_git "$SM" rev-parse --git-dir)/FETCH_HEAD"
                if [[ -s "$FH" ]]; then
                  TARGET_SHA="$(awk 'NR==1{print $1}' "$FH")"
                  [[ -n "$TARGET_SHA" ]] && FETCH_OK=1
                fi
              fi
            fi

            if [[ $FETCH_OK -eq 0 ]]; then
              echo "::error::fetch failed for ${SM} (url=${SM_URL}, declared_branch=${SM_BRANCH:-<none>})"
              FAILED_ANY=1
              if [[ -z "$FAILED_NAMES" ]]; then
                FAILED_NAMES="${SM}(fetch)"
              else
                FAILED_NAMES="${FAILED_NAMES}, ${SM}(fetch)"
              fi
              continue
            fi
            if [[ -z "$TARGET_SHA" ]]; then
              echo "::error::target SHA not resolved for ${SM} after successful fetch"
              FAILED_ANY=1
              if [[ -z "$FAILED_NAMES" ]]; then
                FAILED_NAMES="${SM}(resolve)"
              else
                FAILED_NAMES="${FAILED_NAMES}, ${SM}(resolve)"
              fi
              continue
            fi
            SHORT_AFTER="${TARGET_SHA:0:9}"

            # 4) Checkout submodule to latest tip (detached). 允许小概率 checkout warning 不中断。
            CO_STDOUT="$(mktemp)"
            if ! sm_git "$SM" checkout --detach "$TARGET_SHA" >"$CO_STDOUT" 2>&1; then
              echo "::warning::checkout --detach for ${SM} printed non-zero exit, stderr/stdout last 5 lines:"
              tail -n 5 "$CO_STDOUT"
            fi
            head -n 2 "$CO_STDOUT" || true
            rm -f "$CO_STDOUT"

            # 5) Stage the gitlink pointer update
            BEFORE_STAGED="$BEFORE"
            AFTER_STAGED="$(sm_git "$SM" rev-parse HEAD 2>/dev/null || printf '%s' "$TARGET_SHA")"
            SHORT_AFTER_STAGED="${AFTER_STAGED:0:9}"
            git add -- "$SM"

            # 6) Compare; if equal, no change
            if [[ "$BEFORE_STAGED" == "$AFTER_STAGED" ]]; then
              echo "  子模块 ${SM} 已是最新 (${SHORT_AFTER_STAGED})."
              continue
            fi

            UPDATED_ANY=1
            if [[ -z "$UPDATED_NAMES" ]]; then
              UPDATED_NAMES="$SM"
              UPDATED_PATHS="$SM"
            else
              UPDATED_NAMES="${UPDATED_NAMES}, ${SM}"
              UPDATED_PATHS="${UPDATED_PATHS} ${SM}"
            fi

            # 7) Range log → markdown file (shell 截断 20 行，不使用 head -n | pipe 避免 pipefail 陷阱)
            LOG_FILE="${LOG_DIR}/$(echo "$SM" | tr '/' '_').log"
            RANGE_LOG=""
            if RANGE_TMP="$(sm_git "$SM" log --oneline --decorate "${BEFORE_STAGED}..${AFTER_STAGED}" 2>/dev/null)"; then
              RANGE_LOG="$RANGE_TMP"
            fi
            if [[ -z "$RANGE_LOG" ]]; then
              RANGE_TMP=""
              if RANGE_TMP="$(sm_git "$SM" log --oneline -n 20 "${AFTER_STAGED}" 2>/dev/null)"; then
                RANGE_LOG="$RANGE_TMP"
              fi
            fi
            if [[ -z "$RANGE_LOG" ]]; then
              RANGE_LOG="(no commits in range or shallow fetch incomplete)"
            fi
            {
              echo "RANGE: ${SHORT_BEFORE}..${SHORT_AFTER_STAGED}"
              echo "URL: ${SM_URL}"
              echo "BRANCH: ${SM_BRANCH_EFFECTIVE:-<unknown>}"
              echo
              i=0
              while IFS= read -r ln; do
                printf '%s\n' "$ln"
                i=$((i+1))
                [[ $i -ge 20 ]] && break
              done <<< "$RANGE_LOG"
            } > "$LOG_FILE"
            echo "  -> 更新：${SHORT_BEFORE}..${SHORT_AFTER_STAGED}，日志写入 ${LOG_FILE}"
          done

          echo "updated_any=${UPDATED_ANY}" >> "$GITHUB_OUTPUT"
          echo "updated_names=${UPDATED_NAMES}" >> "$GITHUB_OUTPUT"
          echo "updated_paths=${UPDATED_PATHS}" >> "$GITHUB_OUTPUT"
          echo "failed_any=${FAILED_ANY}" >> "$GITHUB_OUTPUT"
          echo "failed_names=${FAILED_NAMES}" >> "$GITHUB_OUTPUT"
          echo "debugdir=${DEBUG_DIR}" >> "$GITHUB_OUTPUT"

          if [[ $FAILED_ANY -eq 1 ]]; then
            echo "::error::存在 fetch/解析失败的子模块：${FAILED_NAMES}。请查看日志 DEBUG_DIR=${DEBUG_DIR}"
            exit 2
          fi

      - name: Job summary (dry-run or no-change readable result)
        if: always()
        run: |
          set -eu
          LOG_DIR="${{ steps.changes.outputs.logdir }}"
          DEBUG_DIR="${{ steps.changes.outputs.debugdir }}"
          TARGET="${{ steps.target.outputs.target }}"
          SELECTED="${{ steps.list.outputs.selected }}"
          FAILED_ANY="${{ steps.changes.outputs.failed_any }}"
          FAILED_NAMES="${{ steps.changes.outputs.failed_names }}"
          {
            echo "### Hourly submodule sync — target branch: \`${TARGET}\`"
            echo
            echo "- scope (selected): \`${SELECTED}\`"
            echo "- updated_any: ${{ steps.changes.outputs.updated_any }}"
            echo "- updated: \`${{ steps.changes.outputs.updated_names }}\`"
            echo "- failed_any: \`${FAILED_ANY}\`"
            echo "- failed: \`${FAILED_NAMES}\`"
            [[ -n "$DEBUG_DIR" ]] && echo "- debugdir (runner local): \`${DEBUG_DIR}\`"
            echo
            if [[ -n "$FAILED_NAMES" ]]; then
              echo "<details><summary>failed submodules — per-repo stderr snippets</summary>"
              echo
              shopt -s nullglob
              for f in "${DEBUG_DIR}"/*.err; do
                [[ -s "$f" ]] || continue
                title="$(basename "$f" .err)"
                echo "#### ${title}"
                echo '```'
                tail -n 60 "$f" 2>/dev/null || true
                echo '```'
                echo
              done
              echo "</details>"
              echo
            fi
            if [[ -d "$LOG_DIR" ]]; then
              shopt -s nullglob
              for f in "$LOG_DIR"/*.log; do
                title="$(basename "$f" .log)"
                echo "#### ${title}"
                echo '```'
                cat "$f"
                echo '```'
                echo
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create sync branch + commit + Pull Request
        if: steps.changes.outputs.updated_any == '1' && github.event.inputs.only_check != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.target.outputs.target }}
          STAMP: ${{ steps.changes.outputs.stamp }}
          UPDATED_NAMES: ${{ steps.changes.outputs.updated_names }}
          UPDATED_PATHS: ${{ steps.changes.outputs.updated_paths }}
          LOG_DIR: ${{ steps.changes.outputs.logdir }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -eu
          # 临时关闭 auto-gc，避免 PR 步骤的 fetch/push 触发后台 repack 与并发竞争
          git config --global gc.auto 0 || true

          # 本步骤前面的 base-fetch (TARGET_BRANCH) 与后面 push / gh pr create 都需要对 gotoded/sunnypilot
          # 仓库鉴权；但子模块 step 中为了避免 GITHUB_TOKEN 泄露到第三方仓库，我们显式全局清了
          # credential/extraheader，并让 checkout 以 persist-credentials=false 匿名落盘 origin。
          # 因此在这个 step 的开头临时把 origin 切到带 x-access-token 的 HTTPS URL；
          # 等 PR 创建结束再把 origin 还原为匿名 URL（防御性兜底，避免 token 残留在 runner 日志）。
          ANONYMOUS_ORIGIN="$(git remote get-url origin)"
          AUTHED_ORIGIN="https://x-access-token:${GH_TOKEN}@github.com/${BASE_REPO}.git"
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::GH_TOKEN 为空，无法为 push/PR 步骤提供鉴权，请检查 workflow permissions / env 注入"
            exit 5
          fi
          git remote set-url origin "$AUTHED_ORIGIN"
          cleanup_auth() {
            # 无论成功失败，尽量把 origin 切回匿名 URL，并清掉任何可能残留的 per-URL extraheader
            git remote set-url origin "$ANONYMOUS_ORIGIN" >/dev/null 2>&1 || true
            git config --local --unset-all "http.https://github.com/${BASE_REPO}.extraheader" >/dev/null 2>&1 || true
          }
          trap cleanup_auth EXIT

          # 把 staged 的子模块指针在跨分支切换时携带；避免 checkout -b 后 index 丢失
          git stash push -- $UPDATED_PATHS >/dev/null 2>&1 || true
          NEW_BRANCH="chore/submodule-sync-${STAMP}"
          git fetch --depth 1 origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git checkout -b "$NEW_BRANCH" "origin/${TARGET_BRANCH}"
          git stash pop >/dev/null 2>&1 || true
          git add -- $UPDATED_PATHS

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 规范化标题串（逗号/空格替换成短横线，列表简洁）
          TITLE_LIST="$(sed 's/, */-/g;s/[ _]/-/g' <<< "$UPDATED_NAMES" | tr -s '-')"
          COMMIT_MSG="chore(submodules): sync ${TITLE_LIST} @ ${STAMP}"
          git commit -m "$COMMIT_MSG"

          # 注意：origin 已在本 step 顶部切换为 x-access-token@ 形式；仍保留最小的 push 重试。
          ok=0
          for i in 1 2 3; do
            echo "  [push $i/3] branch=${NEW_BRANCH}"
            if git push --set-upstream origin "$NEW_BRANCH"; then
              ok=1
              break
            fi
            echo "::warning::push attempt $i failed, retrying after $(( i * 3 ))s..."
            sleep $(( i * 3 ))
          done
          if [[ $ok -ne 1 ]]; then
            echo "::error::git push 最终失败（3 次重试）：无法推送 ${NEW_BRANCH} 到 origin。上一轮常见报错：需要 Username for 'https://github.com' 时请确认 GH_TOKEN 已写入 origin URL"
            exit 6
          fi

          # 组装 PR body：逐子模块读日志文件，规避多行 shell 变量展开陷阱
          BODY_FILE="${RUNNER_TEMP}/pr-body.md"
          {
            echo "自动同步以下子模块到上游分支最新 commit："
            echo
            echo "- 同步范围：\`${UPDATED_NAMES}\`"
            echo "- 触发：\`${GITHUB_EVENT_NAME}\` (workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            shopt -s nullglob
            for f in "$LOG_DIR"/*.log; do
              title="$(basename "$f" .log)"
              RANGE_LINE="$(sed -n '1p' "$f")"
              URL_LINE="$(sed -n '2p' "$f")"
              BR_LINE="$(sed -n '3p' "$f")"
              REST="$(sed -n '5,$p' "$f")"
              RANGE_SHORT="${RANGE_LINE#RANGE: }"
              URL_SHORT="${URL_LINE#URL: }"
              BR_SHORT="${BR_LINE#BRANCH: }"
              SHORT_BEFORE="${RANGE_SHORT%%..*}"
              SHORT_AFTER="${RANGE_SHORT##*..}"
              # commit 数量估算：取 REST 中去掉空行的行数（纯 shell 计数规避 grep -c 0 匹配返回 1 的陷阱）
              N=0
              while IFS= read -r _l; do
                [[ -z "$_l" ]] && continue
                N=$((N+1))
              done <<< "$REST"
              N_DISP="${N:-unknown}"
              echo "### ${title}  \`${SHORT_BEFORE}\` → \`${SHORT_AFTER}\` (约 +${N_DISP} commits)"
              echo
              echo "- 子模块仓库: ${URL_SHORT}"
              echo "- 跟踪分支: \`${BR_SHORT}\`"
              echo
              echo "<details><summary>前 20 条 commit 明细</summary>"
              echo
              echo '```'
              printf '%s\n' "$REST"
              echo '```'
              echo
              echo "</details>"
              echo
            done
          } > "$BODY_FILE"

          # ========== 修复：动态创建标签（如果不存在） ==========
          echo "检查并创建必要的标签（dependencies, submodules）..."
          for label in dependencies submodules; do
            if ! gh label list --limit 100 | grep -q "^$label$"; then
              echo "标签 $label 不存在，正在创建..."
              gh label create "$label" --description "Auto-created by workflow" --color "E99695"
            fi
          done
          # ========== 修复结束 ==========

          PR_TITLE="chore(submodules): sync ${TITLE_LIST} @ ${STAMP}"
          gh pr create \
            --base "${TARGET_BRANCH}" \
            --head "${NEW_BRANCH}" \
            --title "$PR_TITLE" \
            --body-file "$BODY_FILE" \
            --label dependencies --label submodules || {
              echo "::error::gh pr create 失败，请检查 token 的 pull-requests: write 权限"
              exit 4
            }
