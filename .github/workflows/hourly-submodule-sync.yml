- name: List allowed submodules (from .gitmodules)
  id: list
  shell: bash
  run: |
    set -eu
    ALLOWED=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
              | awk '{print $NF}' | sort -u | tr '\n' ',' | sed 's/,$//')
    echo "allowed=${ALLOWED}" >> "$GITHUB_OUTPUT"

    INPUT="${{ github.event.inputs.submodules }}"
    if [[ -z "$INPUT" ]]; then
      SELECTED="$ALLOWED"
    else
      # Trim spaces; filter to allowed paths
      SELECTED=""
      IFS=',' read -ra ARR <<< "$INPUT"
      for i in "${ARR[@]}"; do
        i="${i// /}"
        [[ -z "$i" ]] && continue
        if [[ ",${ALLOWED}," == *",${i},"* ]]; then
          SELECTED="${SELECTED},${i}"
        else
          echo "::warning::忽略不在 .gitmodules 中的子模块名: ${i}"
        fi          # ← 关键修正：将 done 改为 fi
      done
      SELECTED="${SELECTED#,}"
    fi
    if [[ -z "$SELECTED" ]]; then
      echo "::error::没有可处理的有效子模块"
      exit 3
    fi
    echo "selected=${SELECTED}" >> "$GITHUB_OUTPUT"
