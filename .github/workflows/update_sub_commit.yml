name: Update opendbc submodule

on:
  repository_dispatch:
    types:
      - update-opendbc

  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update-opendbc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sunnypilot
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update opendbc submodule
        run: |
          echo "=== Current submodule ==="
          git submodule status

          echo "=== Fetch opendbc master ==="
          git -C opendbc_repo fetch origin master

          echo "=== Remote master ==="
          git -C opendbc_repo rev-parse origin/master

          echo "=== Current HEAD ==="
          git -C opendbc_repo rev-parse HEAD

          echo "=== Update ==="
          git -C opendbc_repo checkout master
          git -C opendbc_repo reset --hard origin/master

          echo "=== New HEAD ==="
          git -C opendbc_repo rev-parse HEAD

      - name: Check update
        run: |
          echo "=== Git status ==="
          git status

          echo "=== Submodule diff ==="
          git diff --submodule

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add opendbc_repo

          if git diff --cached --quiet; then
            echo "opendbc is already up to date."
            exit 0
          fi

          git commit -m "Update opendbc submodule"

          git push
