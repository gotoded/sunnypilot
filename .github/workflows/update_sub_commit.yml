name: Update opendbc submodule

on:
  repository_dispatch:
    types:
      - update-opendbc

  workflow_dispatch:

jobs:
  update-opendbc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sunnypilot
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update opendbc submodule
        run: |
          git submodule update --init --remote opendbc

      - name: Check submodule update
        run: |
          git status
          git diff --submodule

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add opendbc

          if git diff --cached --quiet; then
            echo "opendbc is already up to date."
            exit 0
          fi

          git commit -m "Update opendbc submodule"
          git push
