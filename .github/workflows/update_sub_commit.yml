name: Auto Update Submodule
on:
  repository_dispatch:
    types: [update-opendbc]   # 监听子模块发来的自定义事件

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}  # 重要：用 PAT，不能用默认 GITHUB_TOKEN（防止循环触发）

      - name: Update submodule to latest
        run: |
          git submodule update --init --recursive --remote opendbc
          # 或者指定分支：git submodule update --remote --recursive

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opendbc  # 或 git add .
          git diff --staged --quiet || git commit -m "chore: auto-update opendbc submodule [skip ci]"
          git push
